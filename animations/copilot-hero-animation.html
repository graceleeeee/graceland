<style>
* { margin:0; padding:0; box-sizing:border-box; }

  position:absolute; top:0; left:0;

#s2 { z-index:2; opacity:0; }

  font-family:'Lato', -apple-system, sans-serif;
  white-space:pre-wrap; word-break:break-word;
  pointer-events:none;
  transition: opacity 200ms ease;
}

.cursor {
  display:inline-block; width:2px; height:15px;

  margin-left:1px; animation:blink 0.8s step-end infinite;
}

<script>
const PROMPT = 'Build me an outbound lead qualification agent for a home services company. She will be qualifying leads on their home project and book a call with a Home Project Advisor.';
const sleep = ms => new Promise(r => setTimeout(r, ms));

function setOp(id, val) {
  document.getElementById(id).style.opacity = val;
}

async function run() {
  while (true) {
  // Hold on welcome
  await sleep(500);

  // Fade s2 on top of s1 — s1 stays, s2 dims everything uniformly
  setOp('s2', 1);
  await sleep(400);

  // Type into input box
  setOp('typing', 1);
  await sleep(100);
  const tel = document.getElementById('typing');
  let typed = '';
  for (let i = 0; i < PROMPT.length; i++) {
    typed += PROMPT[i];
    tel.innerHTML = typed + '<span class="cursor"></span>';
    await sleep(10 + Math.random() * 4 - 2);
  }
  tel.innerHTML = typed;
  await sleep(500);

  // Fade typing out first, then fade s3 in
  setOp('typing', 0);
  await sleep(300);
  setOp('s3', 1);
  await sleep(4200);

  // Reset for next loop — snap back instantly, no transition
  ['s1','s2','s3','typing'].forEach(id => {
    document.getElementById(id).style.transition = 'none';
  });
  setOp('s1', 1);
  setOp('s2', 0);
  setOp('s3', 0);
  setOp('typing', 0);
  document.getElementById('typing').innerHTML = '';
  await sleep(50);
  // Restore transitions
  ['s1','s2','s3'].forEach(id => {
    document.getElementById(id).style.transition = 'opacity 600ms ease';
  });
  document.getElementById('typing').style.transition = 'opacity 200ms ease';
  await sleep(800);
  } // end while
}

window.addEventListener('load', () => setTimeout(run, 400));
</script>
