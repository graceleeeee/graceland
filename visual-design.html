<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Visual Design — Grace Lee</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --cream: #fdf9f5;
    --orange: #FF5500;
    --orange-light: #fff3e8;
    --text: #0a0a3a;
    --muted: #888;
    --white: #ffffff;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--cream);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-weight: 400;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }



  /* NAV */
  nav {
    position: sticky;
    top: 0;
    z-index: 100;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 18px 60px;
    border-bottom: 1px solid rgba(255,85,0,0.2);
    background: var(--cream);
  }
  .nav-name {
    font-family: 'Instrument Serif', serif;
    font-size: 1.1rem;
    color: var(--orange);
    text-decoration: none;
  }
  .nav-links {
    display: flex;
    gap: 36px;
    list-style: none;
  }
  .nav-links a {
    font-size: 0.82rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--orange);
    opacity: 0.7;
    text-decoration: none;
    transition: opacity 0.2s;
  }
  .nav-links a:hover { opacity: 1; }

  /* MAIN */
  main {
    position: relative;
    z-index: 1;
    flex: 1;
    padding: 48px 72px 80px;
    max-width: 960px;
    margin: 0 auto;
    width: 100%;
  }

  /* PAGE HEADER */
  .page-header {
    border: 2px solid var(--orange);
    background: var(--white);
    margin-bottom: 40px;
  }
  .window-titlebar {
    background: var(--orange-light);
    border-bottom: 2px solid var(--orange);
    padding: 5px 14px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .window-title {
    font-size: 0.65rem;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--orange);
    font-weight: 500;
  }
  .page-header-body {
    padding: 28px 32px;
  }
  .page-title {
    font-family: 'Instrument Serif', serif;
    font-size: clamp(2rem, 5vw, 3.2rem);
    color: var(--orange);
    line-height: 1.05;
  }
  .page-subtitle {
    font-size: 0.78rem;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--muted);
    margin-top: 10px;
  }

  /* SLIDESHOW WINDOW */
  .slideshow-window {
    border: 2px solid var(--orange);
    background: var(--white);
    position: relative;
  }
  .slideshow-area {
    position: relative;
    overflow: hidden;
    height: 560px;
  }
  .slides-track {
    display: flex;
    height: 100%;
    transition: transform 0.4s ease;
  }
  .vd-slide {
    min-width: 100%;
    height: 100%;
  }
  .vd-slide img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: block;
  }
  .slide-btn {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    background: var(--orange);
    color: white;
    border: none;
    width: 40px;
    height: 40px;
    border-radius: 99px;
    font-size: 1rem;
    cursor: pointer;
    z-index: 10;
    transition: background 0.2s;
  }
  .slide-btn:hover { background: #cc4400; }
  .slide-btn.prev { left: -56px; }
  .slide-btn.next { right: -56px; }

  /* SLIDE INFO FOOTER */
  .slide-info {
    border-top: 1px solid rgba(255,85,0,0.2);
    padding: 14px 18px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
  }
  .slide-label {
    font-size: 0.6rem;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 5px;
  }
  .slide-article a {
    color: var(--orange);
    font-size: 0.78rem;
    font-weight: 500;
    letter-spacing: 0.06em;
    text-decoration: underline;
    text-underline-offset: 3px;
  }
  .slide-counter {
    font-size: 0.65rem;
    letter-spacing: 0.12em;
    color: var(--muted);
    white-space: nowrap;
  }

  /* MOBILE */
  @media (max-width: 768px) {
    nav { padding: 20px 24px; }
    main { padding: 32px 56px 60px; }
    .page-header-body { padding: 20px; }
    .slideshow-area { height: 320px; }
    .nav-links { gap: 16px; }
  }
</style>
</head>
<body>

<nav>
  <a href="index.html" class="nav-name">Grace Lee</a>
  <ul class="nav-links">
    <li><a href="index.html">Work</a></li>
    <li><a href="contact.html">Contact</a></li>
  </ul>
</nav>

<main>

  <div class="page-header">
    <div class="window-titlebar">
      <span class="window-title">visual-design.exe</span>
      <span style="font-size:0.75rem;color:var(--orange);">×</span>
    </div>
    <div class="page-header-body">
      <div class="page-title">Visual Design</div>
      <div class="page-subtitle">Editorial · Apparel · Digital</div>
    </div>
  </div>

  <div style="position: relative; overflow: hidden;">
    <div id="vd-slides" style="display: flex; transition: transform 0.4s ease;">
      <div style="min-width: 100%;"><img src="images/vd-tcu.jpg" alt="Refinery29 — Saniyya Sidney & Demi Singleton" style="width: 100%; display: block; border-radius: 8px;" /></div>
      <div style="min-width: 100%;"><img src="images/vd-cl.jpg" alt="Refinery29 — CL" style="width: 100%; display: block; border-radius: 8px;" /></div>
      <div style="min-width: 100%;"><img src="images/rationalle-shirt1.png" alt="Rationalle T-Shirt Design" style="width: 100%; display: block; border-radius: 8px;" /></div>
      <div style="min-width: 100%;"><img src="images/rationalle-shirt2.png" alt="Rationalle T-Shirt Design" style="width: 100%; display: block; border-radius: 8px;" /></div>
      <div style="min-width: 100%;"><img src="images/rationalle-shirt3.png" alt="Rationalle T-Shirt Design" style="width: 100%; display: block; border-radius: 8px;" /></div>
      <div style="min-width: 100%;"><img src="images/rationalle-web-graphics.jpg" alt="Rationalle Web Graphics" style="width: 100%; display: block; border-radius: 8px;" /></div>
      <div style="min-width: 100%;"><img src="images/rationalle-social-ad-graphics.jpg" alt="Rationalle Ad Graphics" style="width: 100%; display: block; border-radius: 8px;" /></div>
    </div>
  </div>

  <!-- Controls row -->
  <div style="display: flex; align-items: center; justify-content: space-between; margin-top: 20px;">

    <!-- Left: label + link -->
    <div>
      <div id="vd-label" style="font-size: 0.72rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); margin-bottom: 5px;"></div>
      <div id="vd-article"></div>
    </div>

    <!-- Right: prev · counter · next -->
    <div style="display: flex; align-items: center; gap: 12px;">
      <button onclick="vdPrev()" style="background: none; border: 1px solid rgba(255,85,0,0.3); color: var(--orange); width: 40px; height: 40px; border-radius: 50%; font-size: 1rem; cursor: pointer; display: flex; align-items: center; justify-content: center;">←</button>
      <span id="vd-counter" style="font-size: 0.75rem; letter-spacing: 0.1em; color: var(--muted); white-space: nowrap;"></span>
      <button onclick="vdNext()" style="background: none; border: 1px solid rgba(255,85,0,0.3); color: var(--orange); width: 40px; height: 40px; border-radius: 50%; font-size: 1rem; cursor: pointer; display: flex; align-items: center; justify-content: center;">→</button>
    </div>

  </div>

</main>

<script>
const vdArticles = [
  { range: [0,0], label: 'Editorial Content for Refinery29 · 2021', title: 'The Come Up — Saniyya Sidney & Demi Singleton', url: 'https://www.refinery29.com/en-us/2021/11/10718625/the-come-up-saniyya-sidney-demi-singleton' },
  { range: [1,1], label: 'Editorial Content for Refinery29 · 2021', title: 'Verified — CL, K-Pop Veteran', url: 'https://www.refinery29.com/en-us/2021/12/10725331/cl-alpha-kpop-singer-chaelin-interview' },
  { range: [2,4], label: 'T-Shirt Design for Rationalle · 2022', title: '@RationalleWorld', url: 'https://www.instagram.com/rationalleworld/' },
  { range: [5,5], label: 'Web Graphics for Rationalle · 2022', title: null, url: null },
  { range: [6,6], label: 'Ad Graphics for Rationalle · 2022', title: null, url: null },
];
let vdIdx = 0;
const vdTotal = 7;

function vdUpdate() {
  document.getElementById('vd-slides').style.transform = `translateX(-${vdIdx * 100}%)`;
  document.getElementById('vd-counter').textContent = `${vdIdx + 1} of ${vdTotal}`;
  const art = vdArticles.find(a => vdIdx >= a.range[0] && vdIdx <= a.range[1]);
  if (art) {
    document.getElementById('vd-label').textContent = art.label;
    if (art.url && art.title) {
      document.getElementById('vd-article').innerHTML = `<a href="${art.url}" target="_blank" style="color:var(--orange);font-size:0.78rem;font-weight:500;letter-spacing:0.06em;text-decoration:underline;text-underline-offset:3px;">${art.title} ↗</a>`;
    } else {
      document.getElementById('vd-article').innerHTML = '';
    }
  }
}
function vdNext() { vdIdx = (vdIdx + 1) % vdTotal; vdUpdate(); }
function vdPrev() { vdIdx = (vdIdx - 1 + vdTotal) % vdTotal; vdUpdate(); }

document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight') vdNext();
  if (e.key === 'ArrowLeft') vdPrev();
});

vdUpdate();
</script>

</body>
</html>
