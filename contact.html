<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact — Grace Lee</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --cream: #fdf9f5;
    --orange: #FF5500;
    --orange-light: #fff3e8;
    --text: #0a0a3a;
    --muted: #555;
    --rule: rgba(255,85,0,0.15);
    --black: #0a0a3a;
    --off-white: #fdf9f5;
    --accent: #FF5500;
    --accent-light: #fff3e8;
    --warm-gray: #aaa;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--cream);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-weight: 300;
    line-height: 1.7;
    font-size: 17px;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }
  nav {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 18px 60px;
    border-bottom: 1px solid rgba(255,85,0,0.2);
    background: var(--cream);
  }
  .nav-name {
    display: flex;
    align-items: center;
    gap: 10px;
    text-decoration: none;
  }
  .nav-logo {
    width: 36px;
    height: 36px;
    object-fit: contain;
    mix-blend-mode: multiply;
  }
  .nav-name-text {
    font-family: 'Instrument Serif', serif;
    font-size: 1.1rem;
    letter-spacing: 0.01em;
    color: var(--orange);
  }
  .nav-links {
    display: flex;
    gap: 36px;
    list-style: none;
  }
  .nav-links a {
    text-decoration: none;
    font-size: 0.82rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--orange);
    opacity: 0.7;
    transition: opacity 0.2s;
  }
  .nav-links a:hover { opacity: 1; }
  .contact-wrap {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 80px 60px;
  }
  .contact-inner {
    display: grid;
    grid-template-columns: 300px 1fr;
    gap: 80px;
    align-items: center;
    max-width: 860px;
    width: 100%;
  }
  .contact-inner img {
    width: 100%;
    border-radius: 4px;
  }
  h2 {
    font-family: 'Instrument Serif', serif;
    font-size: 2.4rem;
    font-weight: 400;
    color: var(--black);
    margin-bottom: 20px;
  }
  .contact-inner p {
    font-size: 0.95rem;
    color: var(--muted);
    margin-bottom: 6px;
  }
  .contact-inner a.link {
    color: var(--black);
    text-decoration: underline;
    font-size: 0.95rem;
    display: block;
    margin-bottom: 4px;
  }
  .proto-link {
    display: inline-block;
    background: var(--black);
    color: var(--off-white);
    padding: 12px 28px;
    text-decoration: none;
    font-size: 0.8rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    margin-top: 28px;
    transition: background 0.2s;
  }
  .proto-link:hover { background: var(--accent); }
  footer {
    border-top: 1px solid rgba(255,85,0,0.2);
    padding: 10px 32px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: var(--cream);
  }
  .footer-left {
    font-size: 0.62rem;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .footer-right {
    font-size: 0.62rem;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .footer-links {
    display: flex;
    gap: 28px;
    list-style: none;
  }
  .footer-links a {
    font-size: 0.75rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--muted);
    text-decoration: none;
    transition: color 0.2s;
  }
  .footer-links a:hover { color: var(--black); }
  @media (max-width: 700px) {
    nav { padding: 20px 24px; }
    .contact-wrap { padding: 48px 24px; }
    .contact-inner { grid-template-columns: 1fr; gap: 32px; }
    footer { padding: 28px 24px; }
  }

</style>
</head>
